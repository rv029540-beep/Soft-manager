<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request For Quotation - List</title>
    <link rel="stylesheet" href="../css/Inventory.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>
    <div class="top-strip">
        <div class="search">
            <input id="searchBox" type="text" placeholder="Menu Search">
            <ul id="searchResults" class="search-dropdown"></ul>
        </div>
    </div>
    <div class="inventory-page">
        <header class="voucher-header">
            <div>
                <div class="breadcrumb-title">Request For Quotation</div>
                <div class="breadcrumb-path">Inventory Transactions / Transactions / Purchases / Request For Quotation</div>
            </div>
            <div class="voucher-actions">
                <button id="newRFQBtn" class="toolbar-btn" title="New RFQ"><i class="fa-solid fa-plus"></i></button>
                <button id="refreshRFQBtn" class="toolbar-btn" title="Refresh"><i class="fa-solid fa-arrows-rotate"></i></button>
                <button id="openRFQCreateBtn" class="toolbar-btn" title="Create RFQ"><i class="fa-solid fa-file"></i></button>
                <button id="openQuotationReceiveBtn" class="toolbar-btn" title="Open Quotation Receive" onclick="window.location.href='quotation-receive.html'">Quotation Receive</button>
                <button id="openPOCreateBtn" class="toolbar-btn" title="Open Purchase Order Create" onclick="window.location.href='purchase-order-creation.html'">Create PO</button>
            </div>
        </header>

        <section class="voucher-table-card">
            <div class="voucher-table-wrapper">
                <table class="voucher-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>RFQ No.</th>
                            <th>RFQ Date</th>
                            <th>Requested By</th>
                            <th>Workflow</th>
                            <th>Total Items</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rfqTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="../js/autoVoucher.js"></script>
    <script src="../js/searchText.js"></script>
    <script src="../js/rfq-list.js"></script>
</body>
</html>
