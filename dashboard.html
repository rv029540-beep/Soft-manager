<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/dashboard.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<title>Dashboard</title>
</head>
<body>
         <div class="top-strip">
        <div class="search">
            <input id="searchBox" type="text" placeholder="Menu Search">
            <ul id="searchResults" class="search-dropdown">
                
            </ul>
        </div>
        <div class="top-buttons">
            <button class="top-btn" title="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button class="top-btn" title="Messages">
                <i class="fa-solid fa-envelope"></i>
            </button>
            <button class="top-btn" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button class="top-btn" title="Help">
                <i class="fa-solid fa-circle-question"></i>
            </button>
            <button class="top-btn" title="Profile">
                <i class="fa-solid fa-user-circle"></i>
            </button>
            <button class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
               <b>Log-out</b>
            </button>
        </div>
    </div>
             <script src="js/dashboard.js"></script> 
</body>
</html>
